[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kleisis"
version = "0.2.0"
description = "Deterministic schema-closure materializer"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{name = "Esther Poniatowski", email = "esther.poniatowski@ens.psl.eu"}]
dependencies = [
    "hodegos @ git+https://github.com/esther-poniatowski/hodegos.git@e61d0d97eaa80cc0cfdd90c3022c1e3916ef1ad9",
    "PyYAML>=6.0,<7",
]

[project.scripts]
kleisis = "kleisis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kleisis = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["kleisis"]

# --- Release ---------------------------------------------------------------------------------------
# Read by the workflow `release.yml`. One version is stamped in the Python package and in the
# TypeScript reader, whose tarball each release attaches.

[tool.semantic_release]
branch = "main"
commit_message = "release: {version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "conventional"
tag_format = "v{version}"
major_on_zero = false
allow_zero_version = true
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/kleisis/__init__.py:__version__", "packages/registry/package.json:version"]
build_command = "python -m pip install build && python -m build"

[tool.semantic_release.commit_parser_options]
major_versions = ["BREAKING CHANGE"]
minor_versions = ["feat"]
patch_versions = ["fix", "perf", "refactor"]

[tool.semantic_release.remote.token]
type = "github"
env = "GH_TOKEN"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true
