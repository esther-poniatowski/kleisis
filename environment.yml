name: kleisis
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pyyaml>=6,<7
  - pytest>=8,<9
  - pytest-cov>=5,<6
  - mypy>=1.13,<2
  - ruff>=0.8,<1
  - types-pyyaml>=6,<7
  # Sibling tools, pinned by commit; pip installs a Git reference, which a conda dependency cannot
  # name.
  - pip:
      - hodegos @ git+https://github.com/esther-poniatowski/hodegos.git@a151a28010058fda08a652aea345422037ff0d3c
      # The tests check the findings logs with the profile interface of Elenchos.
      - elenchos @ git+https://github.com/esther-poniatowski/elenchos.git@d41d2c00aed8f9668d84efb2ea0464a5eb9867ee
      - -e .
